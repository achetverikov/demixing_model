name: Tests

on:
  push:
    branches:
      - main
      - dev/continuous-density-fixes
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .
  MPLBACKEND: Agg
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"

jobs:
  maintained:
    name: Maintained pytest suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import subprocess
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              project = tomllib.load(handle)["project"]
          dependencies = [
              *project["dependencies"],
              *project["optional-dependencies"]["dev"],
          ]
          subprocess.check_call([sys.executable, "-m", "pip", "install", *dependencies])
          PY

      - name: Run maintained tests
        run: python -m pytest --durations=30

  wnm-smoke:
    name: WNM public-path smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: maintained

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import subprocess
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              project = tomllib.load(handle)["project"]
          dependencies = [
              *project["dependencies"],
              *project["optional-dependencies"]["dev"],
          ]
          subprocess.check_call([sys.executable, "-m", "pip", "install", *dependencies])
          PY

      - name: Run WNM end-to-end smoke test
        run: bash tests/run_smoke_wnm.sh

      - name: Upload smoke outputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-wnm-failure-output
          path: results/smoke_wnm
          if-no-files-found: ignore
