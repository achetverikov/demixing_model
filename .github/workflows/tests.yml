name: Tests

on:
  push:
    branches:
      - main
      - dev/continuous-density-fixes
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .
  MPLBACKEND: Agg
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"

jobs:
  maintained:
    name: Maintained pytest suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check private optimizer token
        env:
          JAX_LBFGSB_TOKEN: ${{ secrets.JAX_LBFGSB_TOKEN }}
        run: |
          if [ -z "$JAX_LBFGSB_TOKEN" ]; then
            echo "::error::Add a repository secret named JAX_LBFGSB_TOKEN with read access to achetverikov/JAX_L-BFGS-B_port."
            exit 1
          fi

      - name: Check out pinned JAX L-BFGS-B dependency
        uses: actions/checkout@v4
        with:
          repository: achetverikov/JAX_L-BFGS-B_port
          ref: 0350da1
          path: .ci/JAX_L-BFGS-B_port
          token: ${{ secrets.JAX_LBFGSB_TOKEN }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import subprocess
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              project = tomllib.load(handle)["project"]
          dependencies = [
              dependency
              for dependency in [
                  *project["dependencies"],
                  *project["optional-dependencies"]["dev"],
              ]
              if not dependency.lower().startswith("jax-lbfgsb ")
          ]
          subprocess.check_call([sys.executable, "-m", "pip", "install", *dependencies])
          subprocess.check_call([
              sys.executable, "-m", "pip", "install", ".ci/JAX_L-BFGS-B_port"
          ])
          PY

      - name: Run maintained tests
        run: python -m pytest --durations=30

  wnm-smoke:
    name: WNM public-path smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: maintained

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check private optimizer token
        env:
          JAX_LBFGSB_TOKEN: ${{ secrets.JAX_LBFGSB_TOKEN }}
        run: |
          if [ -z "$JAX_LBFGSB_TOKEN" ]; then
            echo "::error::Add a repository secret named JAX_LBFGSB_TOKEN with read access to achetverikov/JAX_L-BFGS-B_port."
            exit 1
          fi

      - name: Check out pinned JAX L-BFGS-B dependency
        uses: actions/checkout@v4
        with:
          repository: achetverikov/JAX_L-BFGS-B_port
          ref: 0350da1
          path: .ci/JAX_L-BFGS-B_port
          token: ${{ secrets.JAX_LBFGSB_TOKEN }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import subprocess
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              project = tomllib.load(handle)["project"]
          dependencies = [
              dependency
              for dependency in [
                  *project["dependencies"],
                  *project["optional-dependencies"]["dev"],
              ]
              if not dependency.lower().startswith("jax-lbfgsb ")
          ]
          subprocess.check_call([sys.executable, "-m", "pip", "install", *dependencies])
          subprocess.check_call([
              sys.executable, "-m", "pip", "install", ".ci/JAX_L-BFGS-B_port"
          ])
          PY

      - name: Run WNM end-to-end smoke test
        run: bash tests/run_smoke_wnm.sh

      - name: Upload smoke outputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-wnm-failure-output
          path: results/smoke_wnm
          if-no-files-found: ignore
