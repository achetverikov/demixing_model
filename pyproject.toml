[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demixing-model"
version = "0.0.0"
description = "Demixing Model pipelines for simulation, WNM training, fitting, prediction, and raw surface tools."
requires-python = ">=3.12"
dependencies = [
  "jax==0.11.2",
  "jaxlib==0.11.2",        # CUDA support is supplied by the cuda extra's plugin.
  "jax-lbfgsb @ git+https://github.com/achetverikov/JAX_L-BFGS-B_port.git@0350da1",
  "flax==0.12.10",
  "optax==0.2.8",
  "numpy==2.5.3",
  "filelock>=4.0",
  "pandas==3.0.6",
  "matplotlib==3.11.2",
  "seaborn==0.13.2",
  "pyarrow==25.0.1",
  "boto3==1.43.110",
  "redis==8.1.0",
  "streamlit==1.65.0",
  "plotly==7.1.0",
  "scipy==1.18.1",
]

[project.optional-dependencies]
dev = [
  "pytest",
]
cuda = [
  "jax[cuda13-local]==0.11.2",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
  "integration: requires sibling repositories or external compiled artifacts",
  "slow: substantially slower than ordinary unit/contract tests",
  "gpu: intended for GPU-backed validation",
]

[tool.setuptools.packages.find]
include = ["shared*", "model_fit_to_data*", "surface_simulator_for_predictions*", "surface_computation*", "surrogate_training*", "surface_browser*", "cloud*", "pretrained*"]

[tool.setuptools.package-data]
pretrained = ["*.pkl"]
surface_computation = ["cuda/*.cu", "cuda/*.cuh"]
