[project]
name = "demixing-model"
version = "0.0.0"
description = "Demixing Model pipelines (simulation, NN training, fitting, browser)."
requires-python = ">=3.10"
dependencies = [
  "jax==0.10.1",
  "jaxlib==0.10.1",        # CPU runtime; replaced automatically by jax[cuda13-local]
  "jax-lbfgsb @ git+https://github.com/achetverikov/JAX_L-BFGS-B_port.git@0350da1",
  "flax>=0.10.7",
  "optax>=0.2.5",
  "numpy==2.1.3",
  "pandas==2.3.1",
  "matplotlib==3.10.3",
  "seaborn==0.13.2",
  "pyarrow==21.0.0",
  "boto3==1.34.162",
  "redis==6.4.0",
  "streamlit==1.47.0",
  "plotly==6.2.0",
  "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
  "pytest",
]
cuda = [
  "jax[cuda13-local]==0.10.1",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration and not development and not legacy_surface'"
markers = [
  "integration: requires sibling repositories or external compiled artifacts",
  "legacy_surface: historical surface-NN reproduction contract",
  "development: development-only transition, optimizer-comparison, recovery, or representation checks",
  "slow: substantially slower than ordinary unit/contract tests",
  "gpu: intended for GPU-backed validation",
]
