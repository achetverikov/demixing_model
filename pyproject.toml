[project]
name = "demixing-model"
version = "0.0.0"
description = "Demixing Model pipelines (simulation, NN training, fitting, browser)."
requires-python = ">=3.10"
dependencies = [
  "jax==0.10.1",
  "jaxlib==0.10.1",        # CPU runtime; replaced automatically by jax[cuda13-local]
  "flax>=0.10.7",
  "optax>=0.2.5",
  "numpy==2.1.3",
  "pandas==2.3.1",
  "matplotlib==3.10.3",
  "seaborn==0.13.2",
  "pyarrow==21.0.0",
  "boto3==1.34.162",
  "redis==6.4.0",
  "streamlit==1.47.0",
  "plotly==6.2.0",
]

[project.optional-dependencies]
dev = []
cuda = [
  "jax[cuda13-local]==0.10.1",
]
